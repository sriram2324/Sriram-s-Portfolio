<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#06090e"/>
  
  <!-- Ambient background glow circles -->
  <circle cx="200" cy="150" r="300" fill="#3b82f6" opacity="0.15" filter="blur(80px)"/>
  <circle cx="1000" cy="450" r="350" fill="#9d4edd" opacity="0.15" filter="blur(90px)"/>
  <circle cx="600" cy="300" r="250" fill="#00f5d4" opacity="0.08" filter="blur(80px)"/>

  <!-- Grid overlay -->
  <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>
  <path d="M200 0 V630 M400 0 V630 M600 0 V630 M800 0 V630 M1000 0 V630" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1"/>

  <!-- Card Frame -->
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="#0e1422" fill-opacity="0.8" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Monogram Badge -->
  <rect x="140" y="140" width="70" height="70" rx="18" fill="#131b2e" stroke="#00f5d4" stroke-opacity="0.5" stroke-width="2"/>
  <text x="175" y="185" font-family="'Outfit', sans-serif" font-size="30" font-weight="900" fill="#00f5d4" text-anchor="middle">SR</text>

  <!-- Title & Description -->
  <text x="140" y="270" font-family="'Outfit', sans-serif" font-size="54" font-weight="800" fill="#ffffff">Sriram R</text>
  <text x="140" y="325" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="600" fill="#38bdf8">Data Science &amp; Python Professional</text>
  
  <text x="140" y="390" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Data Analysis • Python Development • SQL Databases • Machine Learning
  </text>

  <!-- Tags -->
  <g transform="translate(140, 435)">
    <rect x="0" y="0" width="110" height="38" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="55" y="24" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#38bdf8" text-anchor="middle">Python</text>

    <rect x="125" y="0" width="145" height="38" rx="8" fill="#1e293b" stroke="#00f5d4" stroke-opacity="0.4"/>
    <text x="197" y="24" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#00f5d4" text-anchor="middle">Data Science</text>

    <rect x="285" y="0" width="120" height="38" rx="8" fill="#1e293b" stroke="#9d4edd" stroke-opacity="0.4"/>
    <text x="345" y="24" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#c084fc" text-anchor="middle">SQL / DB</text>

    <rect x="420" y="0" width="120" height="38" rx="8" fill="#1e293b" stroke="#f43f5e" stroke-opacity="0.4"/>
    <text x="480" y="24" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600" fill="#fb7185" text-anchor="middle">Analytics</text>
  </g>
</svg>
